# Faz uma consulta leve ao Supabase a cada 3 dias para o plano gratuito
# nunca "pausar" por falta de acesso. Não precisa configurar nada:
# lê a URL e a chave pública direto do config.js.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o catálogo
        run: |
          URL=$(grep -oE "SUPABASE_URL:\s*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          KEY=$(grep -oE "SUPABASE_ANON_KEY:\s*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          if echo "$URL$KEY" | grep -q COLE_AQUI; then echo "config.js ainda não preenchido — nada a fazer"; exit 0; fi
          curl -fsS "$URL/rest/v1/catalogo_publico?select=id&limit=1" \
            -H "apikey: $KEY" && echo " ok"
